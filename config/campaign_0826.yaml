campaign:
  name: influencer_discovery_poc_v08_gui
  product: 엘레뉴1 럭스, 엘레뉴2
discovery:
  use_keyword_search: true
  google_actor_id: apify/google-search-scraper
  max_pages_per_query: 1
  keyword_result_limit: 50
  queries:
  - 임신준비
  - 임신필수템
  - 임신주차
  - 임신관리
  - 임신10주차
  - 임신20주차
  seed_usernames:
  - hellochaeyeon
  - yeonddle
  - zzan_date
  - sujin29_
  seed_expansion_depth: 1
  max_related_per_profile: 10
  max_seed_candidates: 40
filters:
  min_followers: 100000
  max_followers: 1000000
  allow_unknown_followers: false
  include_seed_accounts: false
targeting:
  include_keywords:
  - 임신준비
  - 임신
  - 출산
  - 임신주차
  - 임신관리
  - 출산관리
  - 산후조리
  - 임신중
  - 산통
  - 임산부
  - 임신부
  hard_exclude_keywords: []
  soft_exclude_keywords: []
  soft_exclude_penalty: 0.1
  hard_exclude_categories: []
  hard_exclude_category_threshold: 0.2
  gender_filter:
    enabled: true
    target: female
    bio_weight: 3.0
    caption_weight: 1.0
    reject_threshold: 3.0
    opposite_margin: 2.0
analysis:
  ad_keywords:
  - '#광고'
  - '#협찬'
  - '#제품제공'
  - '#유료광고'
  - paid partnership
  - sponsored
  category_keywords:
    fitness:
    - 운동
    - 헬스
    - 러닝
    - 필라테스
    - 요가
    - 오운완
    selfcare:
    - 자기관리
    - 건강관리
    - 루틴
    - 웰니스
    - 식단
    office:
    - 직장인
    - 출근
    - 퇴근
    - 회사
    - 오피스
    lifestyle:
    - 일상
    - 라이프
    - 브이로그
    - 여행
    - 카페
    beauty:
    - 뷰티
    - 메이크업
    - 화장품
    - 스킨케어
    parenting:
    - 육아
    - 아이
    - 키즈
    - 엄마
    - 아기
visual:
  enabled: true
  model_name: google/siglip2-base-patch16-224
  images_per_account: 6
  batch_size: 8
  request_timeout_seconds: 15
  reference_score_weight: 0.7
  consistency_weight: 0.3
performance:
  enabled: true
  accounts_to_analyze: 30
  ad_reels_target: 5
  max_reels_to_scan: 10
  only_posts_newer_than: 6 months
  skip_pinned_posts: true
  include_shares_count: false
commercial_filter:
  min_ad_reels: null
  max_ad_reels_in_scan: null
  max_ad_ratio: null
  reject_no_reel_data: false
scoring:
  desired_categories:
  - fitness
  - selfcare
  - office
  - lifestyle
  weights:
    visual_similarity: 0.3
    content_similarity: 0.2
    category_fit: 0.1
    ad_performance: 0.2
    engagement: 0.15
    follower_fit: 0.05
output:
  sqlite_path: data/influencers.db
  excel_path: output/candidates_v08.xlsx
text_similarity:
  enabled: true
  model_name: intfloat/multilingual-e5-small
  recent_posts: 8
  include_ads: false
  include_bio: true
  caption_weight: 0.8
  hashtag_weight: 0.2
  batch_size: 16
  max_length: 512
  cache_path: cache/text_embeddings.pt
  stop_hashtags:
  - 광고
  - 협찬
  - 제품제공
  - 유료광고
  - 일상
  - 데일리
  - 좋아요
  topic_prompts:
    fitness: 운동 헬스 러닝 필라테스 요가 스포츠 피트니스 콘텐츠
    selfcare: 자기관리 웰니스 건강관리 식단 루틴 라이프스타일 콘텐츠
    fashion: 패션 스타일링 코디 데일리룩 의류 패션 콘텐츠
    beauty: 뷰티 메이크업 스킨케어 화장품 미용 콘텐츠
    office: 직장인 회사 출근 퇴근 오피스 커리어 일상 콘텐츠
    travel: 여행 호텔 해외여행 국내여행 관광 휴가 콘텐츠
    food: 맛집 음식 요리 카페 디저트 먹방 콘텐츠
    parenting: 육아 아이 아기 가족 키즈 부모 콘텐츠
    couple: 연애 커플 데이트 여자친구 남자친구 부부 관계 콘텐츠
    entertainment: 방송 예능 연예인 출연자 셀럽 엔터테인먼트 콘텐츠
similarity_ranking:
  weights:
    visual: 0.3
    topic: 0.35
    hashtag: 0.15
    graph: 0.1
    caption: 0.0
  min_combined_similarity: null
reference_matching:
  top_k_references: 2
  negative_usernames: []
creator_target_gate:
  enabled: true
  min_visual_reference: 0.89
  min_visual_median: 0.82
  min_topic_similarity: 0.5
  min_target_fit: 0.52
  negative_margin_reject: -0.02
  reject_low_visual_pair: true
