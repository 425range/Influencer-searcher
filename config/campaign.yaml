campaign:
  name: "reset48_poc_v02"
  product: "클렌즈 음료"

discovery:
  # keyword_search는 보조 소스입니다.
  use_keyword_search: false
  google_actor_id: "apify/google-search-scraper"
  max_pages_per_query: 1
  keyword_result_limit: 50

  queries:
    - "자기관리 직장인 여성 인플루언서"
    - "운동 자기관리 여성 인플루언서"
    - "라이프스타일 여성 인플루언서"

  # 핵심: 아래 seed에서 Instagram relatedProfiles를 따라 후보를 확장합니다.
  seed_usernames:
    - "lamuzes"
    - "2dumi"

  seed_expansion_depth: 1
  max_related_per_profile: 30
  max_seed_candidates: 120

filters:
  min_followers: 30000
  max_followers: 500000

  # 중요: followers를 못 가져온 계정은 통과시키지 않습니다.
  allow_unknown_followers: false

  # seed 계정 자체는 비교 기준이므로 결과 후보에서는 기본 제외.
  include_seed_accounts: false

analysis:
  ad_keywords:
    - "#광고"
    - "#협찬"
    - "#제품제공"
    - "#유료광고"
    - "paid partnership"
    - "sponsored"

  category_keywords:
    fitness:
      - "운동"
      - "헬스"
      - "러닝"
      - "필라테스"
      - "요가"
      - "오운완"
    selfcare:
      - "자기관리"
      - "건강관리"
      - "루틴"
      - "웰니스"
      - "식단"
    office:
      - "직장인"
      - "출근"
      - "퇴근"
      - "회사"
      - "오피스"
    lifestyle:
      - "일상"
      - "라이프"
      - "브이로그"
      - "여행"
      - "카페"
    beauty:
      - "뷰티"
      - "메이크업"
      - "화장품"
      - "스킨케어"

scoring:
  weights:
    seed_similarity: 0.35
    category_fit: 0.20
    ad_performance: 0.20
    engagement: 0.15
    follower_fit: 0.10

output:
  sqlite_path: "data/influencers.db"
  excel_path: "output/candidates.xlsx"
