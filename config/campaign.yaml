campaign:
  name: influencer_discovery_poc_v07_gui
  product: 클렌즈 음료
discovery:
  use_keyword_search: true
  google_actor_id: apify/google-search-scraper
  max_pages_per_query: 1
  keyword_result_limit: 50
  queries:
  - 자기관리 직장인 여성 인플루언서
  - 운동 자기관리 여성 인플루언서
  - 라이프스타일 여성 인플루언서
  seed_usernames:
  - lamuzes
  - 2dumi
  - minyoung_aori
  - m.inngu
  - __haeppy
  seed_expansion_depth: 1
  max_related_per_profile: 10
  max_seed_candidates: 50
filters:
  min_followers: 100000
  max_followers: 1000000
  allow_unknown_followers: false
  include_seed_accounts: false
targeting:
  include_keywords:
  - 자기관리
  - 운동
  - 직장인
  - 라이프스타일
  - 웰니스
  hard_exclude_keywords:
  - 육아
  - 키즈
  - 남자패션
  - 남성
  - 남자향수
  soft_exclude_keywords:
  - 마운자로
  - 헬스
  soft_exclude_penalty: 0.1
  hard_exclude_categories:
  - parenting
  hard_exclude_category_threshold: 0.2
  gender_filter:
    enabled: true
    target: female
    bio_weight: 3.0
    caption_weight: 1.0
    reject_threshold: 3.0
    opposite_margin: 2.0
analysis:
  ad_keywords:
  - '#광고'
  - '#협찬'
  - '#제품제공'
  - '#유료광고'
  - paid partnership
  - sponsored
  category_keywords:
    fitness:
    - 운동
    - 헬스
    - 러닝
    - 필라테스
    - 요가
    - 오운완
    selfcare:
    - 자기관리
    - 건강관리
    - 루틴
    - 웰니스
    - 식단
    office:
    - 직장인
    - 출근
    - 퇴근
    - 회사
    - 오피스
    lifestyle:
    - 일상
    - 라이프
    - 브이로그
    - 여행
    - 카페
    beauty:
    - 뷰티
    - 메이크업
    - 화장품
    - 스킨케어
    parenting:
    - 육아
    - 아이
    - 키즈
    - 엄마
    - 아기
visual:
  enabled: true
  model_name: google/siglip2-base-patch16-224
  images_per_account: 6
  batch_size: 8
  request_timeout_seconds: 15
  reference_score_weight: 0.7
  consistency_weight: 0.3
performance:
  enabled: true
  accounts_to_analyze: 5
  ad_reels_target: 3
  max_reels_to_scan: 10
  only_posts_newer_than: 6 months
  skip_pinned_posts: true
  include_shares_count: false
commercial_filter:
  min_ad_reels: null
  max_ad_reels_in_scan: null
  max_ad_ratio: null
  reject_no_reel_data: false
scoring:
  desired_categories:
  - fitness
  - selfcare
  - office
  - lifestyle
  weights:
    visual_similarity: 0.3
    content_similarity: 0.2
    category_fit: 0.1
    ad_performance: 0.2
    engagement: 0.15
    follower_fit: 0.05
output:
  sqlite_path: data/influencers.db
  excel_path: output/candidates_v07.xlsx
text_similarity:
  enabled: true
  model_name: intfloat/multilingual-e5-small
  recent_posts: 8
  include_ads: false
  include_bio: true
  caption_weight: 0.8
  hashtag_weight: 0.2
  batch_size: 16
  max_length: 512
  cache_path: cache/text_embeddings.pt
  stop_hashtags:
  - 광고
  - 협찬
  - 제품제공
  - 유료광고
  - 일상
  - 데일리
  - 좋아요
similarity_ranking:
  weights:
    visual: 0.55
    caption: 0.25
    hashtag: 0.1
    graph: 0.1
  min_combined_similarity: null
reference_matching:
  top_k_references: 2
