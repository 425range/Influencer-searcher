campaign:
  name: "influencer_discovery_poc_v04"
  product: "클렌즈 음료"

discovery:
  use_keyword_search: true
  google_actor_id: "apify/google-search-scraper"
  max_pages_per_query: 1
  keyword_result_limit: 50

  queries:
    - "자기관리 직장인 여성 인플루언서"
    - "운동 자기관리 여성 인플루언서"
    - "라이프스타일 여성 인플루언서"

  seed_usernames:
    - "lamuzes"
    - "2dumi"

  seed_expansion_depth: 2
  max_related_per_profile: 20
  max_seed_candidates: 120

filters:
  min_followers: 30000
  max_followers: 500000
  allow_unknown_followers: false
  include_seed_accounts: false

targeting:
  # 포함 키워드는 카테고리 적합도에 사용합니다.
  include_keywords:
    - "자기관리"
    - "운동"
    - "직장인"
    - "라이프스타일"

  # 발견 즉시 제외하고 Rejected 시트에 이유를 남깁니다.
  hard_exclude_keywords:
    - "육아"
    - "키즈"

  # 후보는 유지하되 pre/final score에서 감점합니다.
  soft_exclude_keywords:
    - "뷰티"
  soft_exclude_penalty: 0.10

  # 카테고리 단위 제외. category score가 threshold 이상이면 제외합니다.
  hard_exclude_categories:
    - parenting
  hard_exclude_category_threshold: 0.20

analysis:
  ad_keywords:
    - "#광고"
    - "#협찬"
    - "#제품제공"
    - "#유료광고"
    - "paid partnership"
    - "sponsored"

  category_keywords:
    fitness: ["운동", "헬스", "러닝", "필라테스", "요가", "오운완"]
    selfcare: ["자기관리", "건강관리", "루틴", "웰니스", "식단"]
    office: ["직장인", "출근", "퇴근", "회사", "오피스"]
    lifestyle: ["일상", "라이프", "브이로그", "여행", "카페"]
    beauty: ["뷰티", "메이크업", "화장품", "스킨케어"]
    parenting: ["육아", "아이", "키즈", "엄마", "아기"]

visual:
  enabled: true
  model_name: "google/siglip2-base-patch16-224"
  images_per_account: 6
  batch_size: 8
  request_timeout_seconds: 15

performance:
  enabled: true

  # SigLIP 상위 몇 명만 Reel 상세 분석할지.
  accounts_to_analyze: 30

  # '최근 Reel 5개'가 아니라 '최근 광고 Reel 5개'를 집계합니다.
  ad_reels_target: 5

  # 비용 보호 장치: 한 계정에서 최대 몇 개 Reel까지 가져올지.
  max_reels_to_scan: 30

  # 추가 비용 보호 장치. 비우면 날짜 제한 없음.
  # Apify는 YYYY-MM-DD, ISO timestamp, '3 months' 같은 상대값을 지원합니다.
  only_posts_newer_than: "12 months"

  skip_pinned_posts: true

  # Apify Reel Scraper의 sharesCount는 paying users용 옵션입니다.
  include_shares_count: false

commercial_filter:
  # 광고 경험이 너무 없거나 광고 비율이 지나치게 높은 계정을 제한할 수 있습니다.
  min_ad_reels: null
  max_ad_reels_in_scan: null
  max_ad_ratio: null
  reject_no_reel_data: false

scoring:
  desired_categories:
    - fitness
    - selfcare
    - office
    - lifestyle
  weights:
    visual_similarity: 0.40
    category_fit: 0.20
    ad_performance: 0.20
    engagement: 0.15
    follower_fit: 0.05

output:
  sqlite_path: "data/influencers.db"
  excel_path: "output/candidates_v04.xlsx"
